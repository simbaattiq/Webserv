<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser Compatibility Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .test-box {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 30px;
        }

        .test-box h2 {
            margin-top: 0;
            color: #34495e;
        }

        input[type="text"],
        input[type="file"],
        input[type="submit"],
        button {
            font-family: inherit;
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"],
        input[type="file"] {
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"],
        button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        input[type="submit"]:hover,
        button:hover {
            background-color: #2980b9;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }

        #cgiResult, #deleteResult {
            margin-top: 10px;
            background: #eef1f5;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        form {
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            input, button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Browser Compatibility Test</h1>

        <div class="test-box">
            <h2>🖼️ Image Test</h2>
            <img src="/images" alt="Test Image (will 404 if missing)">
        </div>

        <div class="test-box">
            <h2>📤 Form Upload Test</h2>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="uploaded_file">
                <input type="submit" value="Upload File">
            </form>
        </div>

        <div class="test-box">
            <h2>📁 Directory Test</h2>
            <a href="/test_dir/">View Test Directory</a>
        </div>

        <div class="test-box">
            <h2>🗑️ Delete File Test</h2>
            <form id="deleteForm">
                <label for="deleteFile">File to delete (in uploads):</label>
                <input type="text" id="deleteFile" name="deleteFile" placeholder="e.g. text01.txt">
                <button type="submit">Delete File</button>
            </form>
            <div id="deleteResult"></div>
        </div>

        <div class="test-box">
            <h2>🔁 CGI GET/POST Test</h2>
            <form id="getForm" action="/cgi-bin/test_cgi.py" method="get">
                <input type="text" name="msg" placeholder="Message for GET">
                <button type="submit">Send GET</button>
            </form>
            <form id="postForm" action="/cgi-bin/test_cgi.py" method="post">
                <input type="text" name="msg" placeholder="Message for POST">
                <button type="submit">Send POST</button>
            </form>
            <div id="cgiResult"></div>
        </div>
    </div>

    <script>
        // Delete form
        document.getElementById('deleteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var filename = document.getElementById('deleteFile').value;
            fetch('/uploads/' + encodeURIComponent(filename), { method: 'DELETE' })
                .then(response => response.text())
                .then(data => {
                    document.getElementById('deleteResult').innerText = data;
                })
                .catch(error => {
                    document.getElementById('deleteResult').innerText = 'Error: ' + error;
                });
        });

        // CGI POST
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            fetch(this.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('cgiResult').innerText = data;
            })
            .catch(error => {
                document.getElementById('cgiResult').innerText = 'Error: ' + error;
            });
        });

        // CGI GET
        document.getElementById('getForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var params = new URLSearchParams(new FormData(this)).toString();
            fetch(this.action + '?' + params)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cgiResult').innerText = data;
                })
                .catch(error => {
                    document.getElementById('cgiResult').innerText = 'Error: ' + error;
                });
        });
    </script>
</body>
</html>
